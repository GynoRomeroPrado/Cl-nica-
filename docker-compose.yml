version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinical-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - PRESCRIPTION_SIGNATURE_SECRET=${PRESCRIPTION_SIGNATURE_SECRET}
      - VIDEO_SECRET=${VIDEO_SECRET}
    restart: unless-stopped
    networks:
      - clinical-network

  # Admin Dashboard
  dashboard:
    build:
      context: ./dashboard-admin
      dockerfile: Dockerfile
    container_name: clinical-dashboard
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - clinical-network

networks:
  clinical-network:
    driver: bridge
