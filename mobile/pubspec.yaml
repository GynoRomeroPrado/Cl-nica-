name: health_fitness_app
description: Comprehensive health and fitness mobile application with workout tracking, medication reminders, and gamification.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  lottie: ^3.0.0
  cached_network_image: ^3.3.1

  # Backend & Database
  supabase_flutter: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  android_alarm_manager_plus: ^3.0.4
  permission_handler: ^11.2.0

  # Calendar & Time
  table_calendar: ^3.0.9
  intl: ^0.19.0

  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0
  retry: ^3.1.2

  # ML & Pose Detection (Phase 2)
  # google_ml_kit: ^0.16.0
  # camera: ^0.10.5+5

  # Utils
  uuid: ^4.3.3
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4
  share_plus: ^7.2.1
  image_picker: ^1.0.7

  # Validation & Forms
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  formz: ^0.7.0

  # Analytics & Monitoring
  # sentry_flutter: ^7.14.0
  # mixpanel_flutter: ^2.2.0

  # Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^5.0.0

  # Charts & Visualization
  syncfusion_flutter_charts: ^24.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.1
  very_good_analysis: ^5.1.0

  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  isar_generator: ^3.1.0+1
  hive_generator: ^2.0.1

  # Testing
  mockito: ^5.4.4
  faker: ^2.1.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/quotes/

  # Fonts (using Google Fonts, but can add custom fonts here)
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
